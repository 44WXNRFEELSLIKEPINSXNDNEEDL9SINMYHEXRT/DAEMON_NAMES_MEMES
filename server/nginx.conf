# Coarse, cheap IP-based edge guard (limit_req) — the first line of defense
# before any request reaches the app's Redis-backed per-provider limiter.
# Division of labor: this stops floods/DoS-shaped traffic cheaply and
# generically; the app enforces the actual per-provider business rule.
limit_req_zone $binary_remote_addr zone=dnm_edge:10m rate=30r/m;

server {
    listen 80;
    client_max_body_size 12m;   # matches MAX_REQUEST_BYTES in config.py

    location / {
        limit_req zone=dnm_edge burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://app:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Classification requests can take 20-30s+ (CPU VLM inference).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
